name: Refresh pnpm lockfile (one-time engineering migration)

on:
  push:
    branches:
      - engineering/world-safe-external-hardening-20261013
    paths:
      - package.json
      - .github/workflows/relock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - name: Generate lockfile with pnpm, not by hand
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated pnpm lockfile to engineering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
          else
            git commit -m "chore(lock): regenerate pnpm lockfile for targeted security patches"
            git push origin HEAD:engineering/world-safe-external-hardening-20261013
          fi
